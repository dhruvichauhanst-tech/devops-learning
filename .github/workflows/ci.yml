name: DevOps CI Pipeline

# 1. Trigger this workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # 2. Run this job on a standard Ubuntu Linux virtual machine
    runs-on: ubuntu-latest

    steps:
    # 3. Checkout your repository code into the runner machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # 4. Make your script executable
    - name: Make Script Executable
      run: chmod +x user_audit.sh

    # 5. Run a test case (testing a real user like 'runner' or 'root' inside the Ubuntu container)
    - name: Run Positive Test
      run: ./user_audit.sh root

    # 6. Run a negative test case (testing a fake user to ensure exit code 1)
    - name: Run Negative Test
      run: |
        ./user_audit.sh fakeuser999 && exit 1 || echo "Negative test passed successfully!"
